name: appb2t-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: b2t_test
      POSTGRES_PASSWORD: b2t_test_local_only
      POSTGRES_DB: b2t_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2t_test -d b2t_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["test_data:/var/lib/postgresql/data"]
volumes:
  test_data:
